<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来任务</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><h1>未来任务</h1><p>定时执行，或等行为触发。回调在 AstrBot 进程内运行。</p></div><button id="refresh">刷新任务</button></header><section class="card"><h2>新建任务</h2><label>任务名称<input id="name" placeholder="例如：收到关键词时提醒"></label><label>执行方式<select id="mode"><option value="time">指定时间</option><option value="behavior">行为触发</option></select></label><div id="timeFields"><label>执行时间<input id="runAt" type="datetime-local"></label><label>时区<input id="timezone" value="Asia/Shanghai"></label></div><div id="behaviorFields" hidden><label>匹配方式<select id="matchType"><option value="contains">消息包含</option><option value="regex">正则匹配</option></select></label><label>匹配内容<input id="pattern" placeholder="关键词或正则表达式"></label><label>冷却秒数<input id="cooldown" type="number" min="0" value="30"></label><label>最多触发次数（0 不限）<input id="maxRuns" type="number" min="0" value="1"></label></div><label>回调<select id="callback"></select></label><label>回调参数 JSON<textarea id="payload">{}</textarea></label><button id="create">创建任务</button><p id="status"></p></section><section class="card"><h2>已创建任务</h2><div id="jobs"></div></section></main><script type="module" src="./app.js"></script></body></html>
